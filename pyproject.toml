[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-email-analyzer"
version = "1.0.0"
description = "Static phishing email analyzer: headers, URLs, content, attachments, risk scoring."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
phishing-analyzer = "phishing_analyzer.cli:main"

[tool.setuptools]
packages = ["phishing_analyzer"]
